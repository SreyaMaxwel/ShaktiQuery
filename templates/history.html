<!DOCTYPE html>
<html>
<head>
    <title>Query History</title>
</head>
<body>

<h1>Query History</h1>

<table border="1">

<tr>
    <th>ID</th>
    <th>Query</th>
    <th>Execution Time (ms)</th>
    <th>Rows Returned</th>
    <th>Executed At</th>
</tr>

{% for row in history %}

<tr>

{% for value in row %}

<td>{{ value }}</td>

{% endfor %}

</tr>

{% endfor %}

</table>

</body>
</html>
